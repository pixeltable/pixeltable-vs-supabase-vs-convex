[project]
name = "platform-comparison-pixeltable"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Everything the app needs. No vector database, no queue, no compute service.
    "pixeltable[serve]>=0.7.8",
    "openai-whisper",      # whisper.transcribe
    # The floor pixeltable needs. Below it, resolving the transcript index's dimension
    # calls a method the older package does not define and the failure reads as a missing
    # attribute rather than a version error. PXT-1419.
    "sentence-transformers>=5.4",
    # clip. transformers 5 returns a BaseModelOutputWithPooling from get_image_features
    # rather than a tensor, and pixeltable's own source records that top-k results are
    # wrong there. Same floor as compute-service, so all three embed identically.
    "transformers<5",
    "torch",
    "scenedetect",         # video.scene_detect_content
    "llama-cpp-python",    # the agent's local chat model
]

[[tool.pixeltable.database]]
# The local database: an entry with no name.

[[tool.pixeltable.database]]
# The hosted one, for docs/CLOUD.md. Sized like compute-service's Fargate task, so the
# model work has the same compute on both sides; Whisper shells out to ffmpeg.
name = 'pxt://pixeltable:comparison'
system_dependencies = ['ffmpeg']
python_version = '3.12'
cpu = 2.0
memory_mb = 16384
workers = 1
# The docs also list location and region, fixed at creation; 0.7.10 rejects both, so the
# database takes the platform's default placement and the harness records where it runs.

# The hosted image is built from uv.lock. On Linux, CPU wheels for the two packages whose
# default builds pull CUDA or compile from source: the same indexes compute-service's
# Dockerfile installs from, so both sides run the same builds of the same models.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
llama-cpp-python = [{ index = "llama-cpp-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true
