name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.15.0   # pinned: formatting rules change between minors
      - run: ruff check pixeltable/ compute-service/ harness/ fixtures/
      - run: ruff format --check pixeltable/ compute-service/ harness/ fixtures/

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pydantic pytest httpx
      - name: The test suite must collect, which imports and exercises the contract
        run: python -m pytest harness/ --collect-only -q
      - name: The measuring code is tested, because every published number comes from it
        run: python -m pytest harness/test_metrics.py -q

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - name: Deno's own linter, minus the one rule Supabase's guidance overrides
        working-directory: supabase-app
        run: deno lint supabase/functions/
      - name: Every Edge Function typechecks
        run: |
          deno check supabase-app/supabase/functions/api/index.ts

  convex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: convex-app
      - name: Convex's own ESLint plugin, so "idiomatic" is not our opinion
        working-directory: convex-app
        run: npx eslint convex/
      - name: Generate the code tsc checks against
        working-directory: convex-app
        # Anonymous local deployment, no account needed; the same thing live.yml runs.
        run: npx convex dev --once
      - name: Typecheck against the generated code
        working-directory: convex-app
        run: npx tsc --noEmit

  supabase-advisors:
    # Supabase's own security and performance checks, against a real database.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`. `latest` resolves through the GitHub API, which rate
          # limits and has failed this job for that reason, and it lets the advisors
          # check change without a commit in a repo whose point is reproducibility.
          version: 2.117.0
      - name: Start the local stack
        working-directory: supabase-app
        run: supabase start -x studio,realtime,imgproxy,inbucket,logflare,vector
      - name: No security or performance errors
        working-directory: supabase-app
        run: supabase db advisors --local --type all --level error --fail-on error

  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python harness/run_comparison.py
      - name: Measurements must match the committed docs/metrics.json
        run: git diff --exit-code docs/metrics.json
      - run: python harness/render_summary.py
      - name: Summary chart must match the committed artifacts
        run: git diff --exit-code docs/summary.svg
      - name: Published tables must quote the committed benchmark artifacts
        run: python harness/check_docs.py
