# Repo-level tooling config. Each implementation has its own pyproject.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["harness"]
cache_dir = ".pytest_cache"

[tool.ruff.lint.per-file-ignores]
# A TableModel class body refers to its own annotated columns and to the columns an
# iterator injects. Neither is a binding ruff can see.
"pixeltable/app.py" = ["F821"]

[tool.ruff.lint.isort]
# The repo has a directory named `pixeltable`, which otherwise makes ruff treat the
# package as first-party and sort `import pixeltable as pxt` below its own submodules.
known-third-party = ["pixeltable"]
